name: verify (POC dry-run)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: make verify (offline, no AWS spend, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run make verify
        # The offline harness self-test uses the Python standard library only,
        # so no dependency install is needed. boto3 is imported lazily and is
        # only required for the gated live provisioning path.
        run: make verify

      - name: Install dev dependencies (pytest)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run make test (offline pytest suite, mocks AWS)
        run: make test PYTHON=python
